services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    environment:
      LLM_PROVIDER: gemini/gemini-2.5-flash
      GOOGLE_API_KEY: YOUR_GOOGLE_API_KEY
      LITELLM_MODEL: gemini/gemini-2.5-flash
      BROWSER_MODE: "true"
      HEADLESS: "true"
      STEALTH: "true"
    ports:
      - "11235:11235"
    shm_size: "1gb"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://localhost:8080/
    volumes:
      - searxng-data:/etc/searxng
    restart: unless-stopped
    
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin admin123456; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      mc mb --ignore-existing local/squadra;
      mc version enable local/squadra;

      echo 'MinIO bucket initialized successfully.';
      "

volumes:
  searxng-data:
  minio_data: