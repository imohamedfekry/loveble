[server]
listen = "0.0.0.0:8080"
public_url = "http://localhost:8090"
auto_create_on_push = true

[server.auth]
mode = "token"
anonymous_read = false
tokens = [{ principal = "me", token = "", token_env = "WALGIT_TOKEN_ME", write = true }]

[store]
backend = "s3"
bucket = "walgit"

[store.s3]
endpoint = "http://minio:9000"
region = "us-east-1"