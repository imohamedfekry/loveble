map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name app.loveble.localhost api.loveble.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name ~^\d+\.app\.loveble\.localhost$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.loveble.localhost;

    ssl_certificate /etc/nginx/certs/loveble.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/loveble.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.loveble.localhost;

    ssl_certificate /etc/nginx/certs/loveble.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/loveble.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# Per-project previews: https://<projectId>.app.loveble.localhost/
# The backend reads the project id from the Host header and proxies to the
# sandbox dev server, so paths and assets stay at the app root.
server {
    listen 443 ssl;
    http2 on;
    server_name ~^\d+\.app\.loveble\.localhost$;

    ssl_certificate /etc/nginx/certs/loveble.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/loveble.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
